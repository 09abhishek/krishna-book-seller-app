<div class="page-container">

  <div class="page-breadcrumb-header">
    <h4 class="page-title">Import / Export</h4>
  </div>

  <div class="split-layout">

    <div class="modern-card">
      <div class="card-header">
        <h3><i class="pi pi-download"></i> Export Reports</h3>
      </div>
      <div class="card-body">

        <div class="action-row">
          <div class="action-info">
            <h4>All Collection Report</h4>
            <p>Export all collection data into an Excel file.</p>
          </div>
          <button class="btn-primary" type="button" (click)="exportAllTypeExcel('daily-collection')">
            <ng-container *ngIf="!(collectionreportLoader && exportType === 'daily-collection')">
              <i class="pi pi-download"></i>
            </ng-container>
            <ng-container *ngIf="collectionreportLoader && exportType === 'daily-collection'">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            </ng-container>
            Export
          </button>
        </div>

        <div class="action-row">
          <div class="action-info">
            <h4>All Grand Collection Report</h4>
            <p>Export all grand collection data into an Excel file.</p>
          </div>
          <button class="btn-primary" type="button" (click)="exportAllTypeExcel('grand-collection')">
            <ng-container *ngIf="!(collectionreportLoader && exportType === 'grand-collection')">
              <i class="pi pi-download"></i>
            </ng-container>
            <ng-container *ngIf="collectionreportLoader && exportType === 'grand-collection'">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            </ng-container>
            Export
          </button>
        </div>

      </div>
    </div>

    <ng-container *ngIf="userDetails && userDetails.user_type && userDetails.user_type === 'super_admin'">
      <div class="modern-card">
        <div class="card-header">
          <h3><i class="pi pi-upload"></i> Upload Book Data</h3>
        </div>
        <div class="card-body">

          <div class="action-row upload-row">
            <div class="action-info">
              <h4>Upload Book</h4>
              <p>Import new books using an Excel file (.xls, .xlsx).</p>
            </div>

            <div class="upload-controls">
              <div class="file-input-wrapper">
                <input type="file" id="bookUpload" class="custom-file-input" accept=".xls, .xlsx" (change)="uploadStudentFile($event)">
                <label for="bookUpload" class="file-label">
                  <i class="pi pi-folder-open"></i> Choose File
                </label>
              </div>

              <button class="btn-success" [disabled]="!file" type="button" (click)="submitUploadFile()">
                <i class="pi pi-cloud-upload"></i> Upload
              </button>
            </div>
          </div>

        </div>
      </div>
    </ng-container>

  </div>
</div>
