<div class="content-wrapper">
  <div class="content-heading">
    <div class="content-details flex">
      <h5>{{userId ? 'Update' : 'Create'}} User</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="userForm">

        <div class="row">
          <div class="col-md-6 mb-3">
            <label>First Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="firstname" placeholder="Enter First Name">
            <div *ngIf="userForm.get('firstname').invalid && (userForm.get('firstname').dirty || userForm.get('firstname').touched)" class="text-danger" style="font-size: 12px;">
              First Name is required.
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label>Last Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="lastname" placeholder="Enter Last Name">
            <div *ngIf="userForm.get('lastname').invalid && (userForm.get('lastname').dirty || userForm.get('lastname').touched)" class="text-danger" style="font-size: 12px;">
              Last Name is required.
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <label>Username <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="username" placeholder="Enter Username">
            <div *ngIf="userForm.get('username').invalid && (userForm.get('username').dirty || userForm.get('username').touched)" class="text-danger" style="font-size: 12px;">
              Username is required.
            </div>
          </div>
<!--          <div class="col-md-6 mb-3">-->
<!--            <label>Mobile Number</label>-->
<!--            <input type="text" class="form-control" formControlName="mobno" placeholder="Enter Mobile No">-->
<!--          </div>-->

          <div class="col-md-6 mb-3">
            <label>Role / Privilege <span class="text-danger">*</span></label>
            <select class="form-control" formControlName="privalageType">
              <option value="">Select Role</option>
              <option *ngFor="let role of userType" [value]="role.type">{{ role.name }}</option>
            </select>
            <div *ngIf="userForm.get('privalageType').invalid && (userForm.get('privalageType').dirty || userForm.get('privalageType').touched)" class="text-danger" style="font-size: 12px;">
              Role is required.
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Password <span *ngIf="!userId" class="text-danger">*</span></label>
            <input type="password" class="form-control" formControlName="password" placeholder="Enter Password">

            <div *ngIf="userForm.get('password').invalid && (userForm.get('password').dirty || userForm.get('password').touched)" class="text-danger" style="font-size: 12px;">
              <span *ngIf="userForm.get('password').hasError('required')">Password is required.</span>
              <span *ngIf="userForm.get('password').hasError('minlength')">Password must be at least 5 characters.</span>
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label>Confirm Password <span *ngIf="!userId" class="text-danger">*</span></label>
            <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Confirm Password">

            <div *ngIf="userForm.get('confirmPassword').invalid && (userForm.get('confirmPassword').dirty || userForm.get('confirmPassword').touched)" class="text-danger" style="font-size: 12px;">
              <span *ngIf="userForm.get('confirmPassword').hasError('required')">Confirm Password is required.</span>
              <span *ngIf="userForm.get('confirmPassword').hasError('mismatchedPasswords')">Passwords do not match!</span>
            </div>
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-12 text-end">
            <button type="button" class="btn btn-secondary me-2" (click)="reset()">Cancel</button>
            <button type="button" class="btn btn-primary"
                    [disabled]="isSubmitDisabled() || submitLoader"
                    (click)="onSaveConfirmation()">
              <span *ngIf="submitLoader" class="spinner-border spinner-border-sm me-1"></span>
              {{ userId ? 'Update' : 'Save' }}
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
