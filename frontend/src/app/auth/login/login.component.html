<div class="split-login-wrapper flex">

  <div class="brand-panel">
    <div class="brand-overlay"></div>
    <div class="brand-content">
      <div class="logo-container">
        <img src="assets/img/logo.jpeg" alt="Krishna Book Seller Logo">
      </div>
      <h2>Krishna Book Seller</h2>
      <p>"A room without books is like a body without a soul."</p>
    </div>
  </div>

  <div class="form-panel flex">
    <div class="form-container">
      <div class="mobile-logo">
        <img src="assets/img/logo.jpeg" alt="Logo">
        <h2>Krishna Books</h2>
      </div>

      <div class="form-header">
        <h3>Login</h3>
        <p>Please enter your details to access your account.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="doLogin()">

        <div class="floating-group">
          <input type="text" id="username" formControlName="username" placeholder=" " autocomplete="off">
          <label for="username">User Name</label>
          <div *ngIf="(loginForm.controls['username'].hasError('required') && loginForm.controls['username'].touched)" class="error-data">
            * User Name is required
          </div>
        </div>

        <div class="floating-group">
          <input type="password" id="password" formControlName="password" placeholder=" ">
          <label for="password">Password</label>
          <div *ngIf="(loginForm.controls['password'].hasError('required') && loginForm.controls['password'].touched)" class="error-data">
            * Password is required
          </div>
        </div>

        <div class="form-actions flex">
          <button type="submit" class="primary-btn ripple" [disabled]="loginForm.invalid">
            <span *ngIf="!submitLoader">Log In</span>
            <span *ngIf="submitLoader" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          </button>
        </div>
      </form>

      <div class="footer-note">
        <p>Copyright © {{currentYear}} Krishna Book seller. All Rights Reserved.</p>
      </div>
    </div>
  </div>

</div>
